name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Format, vet, unit and acceptance tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # The acceptance suite supervises real `php artisan queue:work` processes against
    # Redis on 127.0.0.1:6379, in database 15.
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # The dashboard bundle is committed so `go build` needs no Node, and the Go tests read
      # it through the embed. Build it here so the committed output is checked against its
      # sources (docs/adr/0008).
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            tests/browser/package-lock.json

      - name: Install the dashboard
        working-directory: web
        run: npm ci

      - name: Build the dashboard
        working-directory: web
        run: npm run build

      - name: Test the dashboard
        working-directory: web
        run: npm test

      - name: Check the committed bundle
        run: |
          if [ -n "$(git status --porcelain -- web/dist)" ]; then
            echo "::error::web/dist does not match its sources; run npm run build in web/ and commit the result"
            git status --porcelain -- web/dist
            exit 1
          fi

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::these files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # The shipped rules are an artifact an operator's Prometheus loads, so they are checked by
      # the tool it uses rather than only by the parser our own test reads them with. Pinned, so
      # a rule written in a syntax only a newer Prometheus accepts fails here first.
      - name: Check the alerting rules
        env:
          PROMTOOL_VERSION: "3.16.0"
        run: |
          curl -fsSL -o /tmp/prometheus.tar.gz \
            "https://github.com/prometheus/prometheus/releases/download/v${PROMTOOL_VERSION}/prometheus-${PROMTOOL_VERSION}.linux-amd64.tar.gz"
          tar -xzf /tmp/prometheus.tar.gz -C /tmp
          /tmp/prometheus-${PROMTOOL_VERSION}.linux-amd64/promtool check rules \
            deployments/prometheus/gohorizon.rules.yml
          /tmp/prometheus-${PROMTOOL_VERSION}.linux-amd64/promtool test rules \
            deployments/prometheus/gohorizon.rules.test.yml

      - name: go test
        run: go test -race -count=1 ./...

      # The fixture's lock file is tracked, so this replays the exact dependency set
      # the suite was last run against. Validate first, so a manifest the install
      # scripts cannot use fails with validate's message rather than mid-install.
      # --no-check-all skips constraint-range style warnings, which the fixture's
      # intentional `@dev` requirement of the local path package always triggers;
      # schema, lock and publish checks still run.
      - name: Install the acceptance fixture
        working-directory: tests/fixtures/laravel-app
        run: |
          composer validate --strict --no-check-all --no-check-publish
          composer install --no-interaction --no-progress

      # The suite skips when the fixture, PHP or Redis is missing, which would make a
      # green run prove nothing. Fail instead.
      - name: Acceptance suite
        env:
          GOHORIZON_E2E: "1"
        run: |
          set -o pipefail
          go test -count=1 -v ./tests/integration 2>&1 | tee acceptance.log
          if grep -q -- '--- SKIP' acceptance.log; then
            echo "::error::the acceptance suite skipped: the fixture, PHP or Redis was unavailable"
            exit 1
          fi

      # The one browser test: the compiled binary, the fixture's worker and a real store,
      # read through Chromium. It follows the acceptance suite because it needs the fixture
      # and the Redis the suite has already installed and exercised.
      - name: Install the browser smoke
        working-directory: tests/browser
        run: npm ci

      - name: Install Chromium
        working-directory: tests/browser
        run: npx playwright install --with-deps chromium

      - name: Browser smoke
        working-directory: tests/browser
        env:
          GOHORIZON_E2E: "1"
        run: |
          set -o pipefail
          npx playwright test 2>&1 | tee smoke.log
          if grep -qE '[0-9]+ skipped' smoke.log; then
            echo "::error::the browser smoke skipped: the fixture, PHP or Redis was unavailable"
            exit 1
          fi
